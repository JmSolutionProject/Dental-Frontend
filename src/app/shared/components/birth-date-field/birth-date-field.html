<div class="birth-date-field" [class.birth-date-field--readonly]="readonly()" [class.birth-date-field--filled]="isValid()">
  <div class="birth-date-inputs">
    <input
      type="text"
      inputmode="numeric"
      class="bd-segment"
      data-bd-field="day"
      maxlength="2"
      placeholder="DD"
      [value]="day()"
      [readOnly]="readonly()"
      (input)="onDayInput($event, dayEl)"
      (keydown)="onKeyDown($event, 'day')"
      #dayEl
    />
    <span class="bd-separator">/</span>
    <input
      type="text"
      inputmode="numeric"
      class="bd-segment"
      data-bd-field="month"
      maxlength="2"
      placeholder="MM"
      [value]="month()"
      [readOnly]="readonly()"
      (input)="onMonthInput($event, monthEl)"
      (keydown)="onKeyDown($event, 'month')"
      #monthEl
    />
    <span class="bd-separator">/</span>
    <input
      type="text"
      inputmode="numeric"
      class="bd-segment"
      data-bd-field="year"
      maxlength="4"
      placeholder="AAAA"
      [value]="year()"
      [readOnly]="readonly()"
      (input)="onYearInput($event, yearEl)"
      (keydown)="onKeyDown($event, 'year')"
      #yearEl
    />
    <button
      type="button"
      class="bd-calendar-btn"
      [disabled]="readonly()"
      (click)="openNativePicker(nativeDateEl)"
      title="Abrir calendario"
      aria-label="Abrir calendario"
    >
      <ng-icon name="heroCalendarDays" size="16" />
    </button>
    <input
      #nativeDateEl
      type="date"
      class="bd-native"
      [value]="year() && month() && day() ? year() + '-' + month().padStart(2,'0') + '-' + day().padStart(2,'0') : ''"
      [readOnly]="readonly()"
      tabindex="-1"
      aria-hidden="true"
      (change)="onNativeChange($event)"
    />
  </div>
  @if (ageText(); as text) {
    <span class="bd-age">{{ text }}</span>
  }
</div>
