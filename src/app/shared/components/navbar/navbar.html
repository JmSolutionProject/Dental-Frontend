<header class="topbar">
  <div class="topbar-title">
    <h2 translate="no">Clínica Dental OMAYA</h2>
    <span class="topbar-tagline">Nuestra Meta: Tu Sonrisa</span>
  </div>
  <div class="topbar-actions">
    <button class="theme-btn" type="button" (click)="toggleTheme()" [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
      <ng-icon [name]="theme.isDark() ? 'heroSun' : 'heroMoon'" size="18" />
    </button>
    <button class="logout" type="button" (click)="logout()">
      <ng-icon name="heroArrowRightStartOnRectangle" class="logout-icon" aria-hidden="true" />
      Cerrar sesión
    </button>
  </div>
</header>
