<header class="topbar">
  <div class="topbar-title">
    <h2 translate="no">Clínica Dental OMAYA</h2>
    <span class="topbar-tagline">Nuestra Meta: Tu Sonrisa</span>
  </div>
  <div class="topbar-actions">
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
      [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'"
      (click)="toggleTheme()"
    >
      <ng-icon [name]="theme.isDark() ? 'heroSun' : 'heroMoon'" aria-hidden="true" />
      <span>{{ theme.isDark() ? 'Claro' : 'Oscuro' }}</span>
    </button>
    <button class="logout" type="button" (click)="logout()">
      <ng-icon name="heroArrowRightStartOnRectangle" class="logout-icon" aria-hidden="true" />
      Cerrar sesión
    </button>
  </div>
</header>
