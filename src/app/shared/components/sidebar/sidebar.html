<aside class="sidebar">
  <a class="brand" routerLink="/dashboard" translate="no">
    <img src="assets/images/logo.svg" alt="Clínica Dental OMAYA" class="brand-logo-img" />
  </a>

  <nav class="nav" aria-label="Navegación principal">
    @for (item of menu; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="item.iconPath" />
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <button class="logout-button" type="button" (click)="logout()">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 3h8a2 2 0 0 1 2 2v3h-2V5H5v14h8v-3h2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm11.59 5.59L18 10h-7v2h7l-1.41 1.41L18 14.83 21.83 11 18 7.17l-1.41 1.42Z" />
    </svg>
    <span>Cerrar Sesión</span>
  </button>
</aside>
