<aside class="sidebar">
  <a class="brand" routerLink="/dashboard" translate="no">
    <img src="assets/images/logo.svg" alt="Clínica Dental OMAYA" class="brand-logo-img" />
  </a>

  <nav class="nav" aria-label="Navegación principal">
    @for (item of menuService.items; track item.label) {
      <a [routerLink]="item.route" routerLinkActive="active">
        <ng-icon class="nav-icon" [name]="item.iconName" aria-hidden="true" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="user-settings">
    <a class="settings-link" routerLink="/settings" routerLinkActive="active">
      <ng-icon class="nav-icon" name="heroCog6Tooth" aria-hidden="true" />
      <span>Configuración de usuario</span>
    </a>
  </div>
</aside>
