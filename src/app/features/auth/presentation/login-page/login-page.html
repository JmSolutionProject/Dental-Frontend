<main class="login-wrapper">
  <!-- Subtle ambient backdrop light -->
  <div class="glow-backdrop" aria-hidden="true"></div>

  <div class="login-card-container">
    <div class="login-card">

      <!-- Centered Logo Header -->
      <div class="logo-header">
        <img
          src="assets/images/logo.svg"
          alt="Clínica Dental OMAYA"
          class="clinic-logo"
        />
      </div>

      <!-- Welcome Greeting -->
      <div class="greeting-header">
        <span class="eyebrow-tag">Portal Privado</span>
        <h1 class="greeting-title">¡Bienvenido de nuevo!</h1>
        <p class="greeting-subtitle">
          Ingresa tu cuenta para acceder al sistema administrativo de la clínica.
        </p>
      </div>

      <!-- Authentication Form -->
      <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
        <!-- Email Field -->
        <div class="field-container">
          <app-form-field label="Correo Electrónico" [control]="form.controls.email">
            <div class="input-with-icon">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input
                type="email"
                formControlName="email"
                placeholder="doctor@omaya.com"
                autocomplete="email"
              />
            </div>
          </app-form-field>
        </div>

        <!-- Password Field -->
        <div class="field-container">
          <app-form-field label="Contraseña" [control]="form.controls.password">
            <div class="input-with-icon">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password-btn"
                (click)="togglePasswordVisibility()"
                [title]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
                aria-label="Alternar visibilidad de contraseña"
              >
                @if (showPassword) {
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" x2="22" y1="2" y2="22"/>
                  </svg>
                }
              </button>
            </div>
          </app-form-field>
        </div>

        <!-- Server Error Alert -->
        @if (serverError) {
          <div class="login-error" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" x2="12" y1="8" y2="12"/>
              <line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
            <span>{{ serverError }}</span>
          </div>
        }

        <!-- Submit Action -->
        <button
          class="login-submit-btn"
          type="submit"
          [disabled]="form.invalid || submitting"
        >
          @if (submitting) {
            <span class="spinner" aria-hidden="true"></span>
            <span>Accediendo...</span>
          } @else {
            <span>Ingresar</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          }
        </button>
      </form>

      <!-- Footer Info -->
      <footer class="card-footer">
        <p>© Clínica Dental OMAYA</p>
      </footer>

    </div>
  </div>
</main>
