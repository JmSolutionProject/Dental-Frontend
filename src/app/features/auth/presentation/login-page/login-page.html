<main class="login-wrapper">
  <!-- Subtle ambient backdrop light -->
  <div class="glow-backdrop" aria-hidden="true"></div>

  <div class="login-card-container">
    <div class="login-card">

      <!-- Centered Logo Header -->
      <div class="logo-header">
        <img
          src="assets/images/logo.svg"
          alt="Clínica Dental OMAYA"
          class="clinic-logo"
        />
      </div>

      <!-- Welcome Greeting -->
      <div class="greeting-header">
        <span class="eyebrow-tag">Portal Privado</span>
        <h1 class="greeting-title">¡Bienvenido de nuevo!</h1>
        <p class="greeting-subtitle">
          Ingresa tu cuenta para acceder al sistema administrativo de la clínica.
        </p>
      </div>

      <!-- Authentication Form -->
      <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
        <!-- Email Field -->
        <div class="field-container">
          <app-form-field label="Correo Electrónico" [control]="form.controls.email">
            <div class="input-with-icon">
              <ng-icon class="input-icon" name="heroEnvelope" aria-hidden="true" />
              <input
                type="email"
                formControlName="email"
                placeholder="doctor@omaya.com"
                autocomplete="email"
              />
            </div>
          </app-form-field>
        </div>

        <!-- Password Field -->
        <div class="field-container">
          <app-form-field label="Contraseña" [control]="form.controls.password">
            <div class="input-with-icon">
              <ng-icon class="input-icon" name="heroLockClosed" aria-hidden="true" />
              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password-btn"
                (click)="togglePasswordVisibility()"
                [title]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
                aria-label="Alternar visibilidad de contraseña"
              >
                @if (showPassword) {
                  <ng-icon name="heroEye" aria-hidden="true" />
                } @else {
                  <ng-icon name="heroEyeSlash" aria-hidden="true" />
                }
              </button>
            </div>
          </app-form-field>
        </div>

        <!-- Server Error Alert -->
        @if (serverError) {
          <div class="login-error" role="alert">
            <ng-icon name="heroExclamationCircle" aria-hidden="true" />
            <span>{{ serverError }}</span>
          </div>
        }

        <!-- Submit Action -->
        <button
          class="login-submit-btn"
          type="submit"
          [disabled]="form.invalid || submitting"
        >
          @if (submitting) {
            <span class="spinner" aria-hidden="true"></span>
            <span>Accediendo...</span>
          } @else {
            <span>Ingresar</span>
            <ng-icon name="heroArrowRight" aria-hidden="true" />
          }
        </button>
      </form>

      <!-- Footer Info -->
      <footer class="card-footer">
        <p>© Clínica Dental OMAYA</p>
      </footer>

    </div>
  </div>
</main>
