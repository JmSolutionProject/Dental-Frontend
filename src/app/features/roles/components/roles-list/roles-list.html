<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Administración</p>
      <h1>Roles del Sistema</h1>
      <p class="muted">Gestión de roles y permisos.</p>
    </div>
    <button class="btn btn--primary" (click)="openCreateModal()">+ Nuevo Rol</button>
  </header>

  @if (loading()) {
    <div class="card" style="display: flex; justify-content: center; padding: 3rem;">
      <div class="spinner"></div>
    </div>
  } @else {
    <article class="card list-card">
      <app-table
        [columns]="columns"
        [data]="pagedRoles()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalItems]="roles().length"
        emptyMessage="No hay roles registrados."
        (pageChange)="goToPage($event)"
        (pageSizeChange)="changePageSizeValue($event)"
      >
        <ng-template appTableCell="nombreRol" let-role>
          <strong>{{ role.nombreRol }}</strong>
        </ng-template>

        <ng-template appTableCell="estado" let-role>
          <span class="table-pill" [class.table-pill--success]="role.estado === 'active'" [class.table-pill--danger]="role.estado === 'inactive'">
            {{ role.estado === 'active' ? 'Activo' : 'Inactivo' }}
          </span>
        </ng-template>

        <ng-template appTableCell="actions" let-role>
          <div class="table-actions">
            <button class="btn btn--outline btn--sm" (click)="openEditModal(role)">Editar</button>
            <button class="btn btn--danger-outline btn--sm" (click)="deleteRoleRecord(role.id)">Desactivar</button>
          </div>
        </ng-template>
      </app-table>
    </article>
  }
</section>

<app-modal [title]="editingRole() ? 'Editar Rol' : 'Nuevo Rol'" [visible]="showModal()" (close)="closeModal()">
  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <div class="form-group" style="grid-column: 1 / -1;">
      <label class="form-label">Nombre del Rol</label>
      <input type="text" class="form-input" formControlName="nombreRol" placeholder="Ej: Administrador" />
    </div>

    <div class="form-group" style="grid-column: 1 / -1;">
      <label class="form-label">Estado</label>
      <select class="form-input" formControlName="estado">
        <option value="active">Activo</option>
        <option value="inactive">Inactivo</option>
      </select>
    </div>

    <div class="modal-actions" style="grid-column: 1 / -1; margin-top: 1.5rem;">
      <button type="button" class="btn btn--secondary" (click)="closeModal()">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-modal>
