<app-modal title="Nueva Cita" [visible]="visible" (close)="close()">
  <form [formGroup]="form" class="appt-form" (ngSubmit)="submit()">
    <app-form-field label="Paciente" [control]="form.get('patientId')!" [required]="true">
      <select formControlName="patientId" class="appt-form-select">
        <option value="" disabled>Seleccionar paciente…</option>
        @for (p of patients(); track p.id) {
          <option [value]="p.id">{{ p.firstName }} {{ p.lastName }}</option>
        }
      </select>
    </app-form-field>

    <div class="appt-form-row">
      <app-form-field label="Fecha" [control]="form.get('date')!" [required]="true">
        <input type="date" formControlName="date" class="appt-form-input" />
      </app-form-field>
      <app-form-field label="Hora" [control]="form.get('time')!" [required]="true">
        <div class="appt-time-wrapper">
          <input type="time" formControlName="time" class="appt-form-input" />
          <div class="appt-shift-btns">
            <button type="button"
              class="appt-shift-btn"
              [class.appt-shift-btn--active]="selectedShift() === 'morning'"
              (click)="setShift('morning')">Mañana</button>
            <button type="button"
              class="appt-shift-btn"
              [class.appt-shift-btn--active]="selectedShift() === 'afternoon'"
              (click)="setShift('afternoon')">Tarde</button>
          </div>
        </div>
      </app-form-field>
    </div>

    <app-form-field label="Especialista" [control]="form.get('dentistId')!" [required]="true">
      <select formControlName="dentistId" class="appt-form-select">
        <option value="" disabled>Seleccionar doctor…</option>
        @for (doc of doctors(); track doc.id) {
          <option [value]="doc.id">{{ doc.name }}</option>
        }
      </select>
    </app-form-field>

    <div class="appt-form-field">
      <label class="appt-form-label">Categoría</label>
      <select class="appt-form-select" [value]="selectedCategoryId()" (change)="onCategoryChange($event)">
        <option value="">Seleccionar categoría…</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <app-form-field label="Servicio / Procedimiento" [control]="form.get('serviceId')!" [required]="true">
      <select formControlName="serviceId" class="appt-form-select" (change)="onServiceChange($event)">
        <option value="" disabled>{{ selectedCategoryId() ? 'Seleccionar servicio…' : 'Primero elige una categoría' }}</option>
        @for (svc of filteredServices(); track svc.id) {
          <option [value]="svc.id">{{ svc.name }} — S/ {{ svc.price }}</option>
        }
      </select>
    </app-form-field>

    <app-form-field label="Motivo de Consulta" [control]="form.get('reason')!" [required]="true">
      <input
        type="text"
        formControlName="reason"
        class="appt-form-input"
        placeholder="Se autocompleta al elegir servicio"
      />
    </app-form-field>

    <app-form-field label="Observaciones" [control]="form.get('observations')!">
      <textarea
        formControlName="observations"
        class="appt-form-input"
        rows="3"
        placeholder="Ej. Paciente requiere radiografia"
      ></textarea>
    </app-form-field>

    <div class="appt-form-footer">
      <button type="button" class="btn btn--secondary" (click)="close()" [disabled]="saving()">
        Cancelar
      </button>
      <button type="submit" class="btn btn--primary btn--lg" [disabled]="saving()">
        {{ saving() ? 'Creando cita…' : 'Crear Cita' }}
      </button>
    </div>
  </form>
</app-modal>
