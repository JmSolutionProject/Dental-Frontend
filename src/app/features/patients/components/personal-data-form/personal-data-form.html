<form [formGroup]="form" class="personal-data-form" [class.personal-data-form--editing]="editing">
  <section class="form-section">
    <h3 class="form-section-title">Identidad</h3>
    <div class="form-grid form-grid--3col">
      <app-form-field label="Nombres" [control]="form.get('firstName')!" [required]="true">
        <input type="text" formControlName="firstName" [readonly]="!editing" />
      </app-form-field>
      <app-form-field label="Apellidos" [control]="form.get('lastName')!" [required]="true">
        <input type="text" formControlName="lastName" [readonly]="!editing" />
      </app-form-field>
      <app-form-field label="DNI" [control]="form.get('documentNumber')!" [required]="true">
        <div class="input-with-action">
          <input type="text" formControlName="documentNumber" [readonly]="!editing" maxlength="8" />
          @if (editing) {
            <button type="button" class="btn btn--accent" [disabled]="consultingDni" (click)="onLookupDni()">
              {{ consultingDni ? '...' : 'RENIEC' }}
            </button>
          }
        </div>
      </app-form-field>
      <app-form-field label="Fecha de Nacimiento" [control]="form.get('birthDate')!">
        <app-birth-date-field [control]="form.get('birthDate')!" [readonly]="!editing" />
      </app-form-field>
      <app-form-field label="Sexo" [control]="form.get('gender')!">
        <select formControlName="gender" [disabled]="!editing">
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
        </select>
      </app-form-field>
    </div>
  </section>

  <section class="form-section">
    <h3 class="form-section-title">Contacto</h3>
    <div class="form-grid form-grid--3col">
      <app-form-field label="Teléfono" [control]="form.get('phone')!" [required]="true">
        <input type="tel" formControlName="phone" [readonly]="!editing" placeholder="+51 999 999 999" />
      </app-form-field>
      <app-form-field label="Correo Electrónico" [control]="form.get('email')!">
        <input type="email" formControlName="email" [readonly]="!editing" placeholder="ejemplo@correo.com" />
      </app-form-field>
    </div>
  </section>

  <section class="form-section form-section--emergency">
    <h3 class="form-section-title form-section-title--emergency">Contacto de Emergencia</h3>
    <div class="form-grid form-grid--3col">
      <app-form-field label="Parentesco" [control]="form.get('emergencyRelationship')!">
        <select formControlName="emergencyRelationship" [disabled]="!editing">
          <option value="">Seleccionar…</option>
          <option value="Madre">Madre</option>
          <option value="Padre">Padre</option>
          <option value="Cónyuge">Cónyuge</option>
          <option value="Hijo(a)">Hijo(a)</option>
          <option value="Hermano(a)">Hermano(a)</option>
          <option value="Abuelo(a)">Abuelo(a)</option>
          <option value="Tío(a)">Tío(a)</option>
          <option value="Primo(a)">Primo(a)</option>
          <option value="Amigo(a)">Amigo(a)</option>
          <option value="Otro">Otro</option>
        </select>
      </app-form-field>
      <app-form-field label="Teléfono" [control]="form.get('emergencyPhone')!">
        <input type="tel" formControlName="emergencyPhone" [readonly]="!editing" placeholder="+51 999 999 999" />
      </app-form-field>
    </div>
  </section>
</form>
