<section class="page messages-page">
  <header class="page-header messages-hero">
    <div>
      <p class="eyebrow">Mensajes</p>
      <h1>Centro de WhatsApp</h1>
      <p class="muted">Envía mensajes directos, programa campañas y reutiliza plantillas con variables dinámicas.</p>
    </div>
  </header>

  <app-messages-status-bar />

  <nav class="message-tabs" aria-label="Secciones de mensajería WhatsApp">
    <button type="button" [class.active]="activeSection() === 'direct'" (click)="setSection('direct')">
      <span>01</span> Envío Directo
    </button>
    <button type="button" [class.active]="activeSection() === 'scheduled'" (click)="setSection('scheduled')">
      <span>02</span> Mensajes Programados
    </button>
    <button type="button" [class.active]="activeSection() === 'templates'" (click)="setSection('templates')">
      <span>03</span> Plantillas
    </button>
  </nav>

  @switch (activeSection()) {
    @case ('direct') { <app-direct-message-form /> }
    @case ('scheduled') { <app-scheduled-messages-panel /> }
    @case ('templates') { <app-templates-panel /> }
  }
</section>
