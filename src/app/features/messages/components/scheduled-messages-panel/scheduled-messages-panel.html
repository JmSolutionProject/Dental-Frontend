<section class="single-panel-layout">
  <article class="card management-card">
    <div class="card-heading">
      <div>
        <p class="eyebrow">Scheduled Messages</p>
        <h2>Mensajes programados</h2>
        <p class="muted">Gestioná los envíos pendientes sin mezclar el formulario con la lista.</p>
      </div>
      <button class="button button--primary" type="button" (click)="openScheduleModal()">
        <ng-icon name="heroPlus"/> Programar Mensaje
      </button>
    </div>

    <app-table
      [columns]="scheduledColumns"
      [data]="store.scheduledMessages()"
      [totalItems]="store.scheduledMessages().length"
      [showPagination]="false"
      emptyMessage="No hay mensajes programados."
    >
      <ng-template appTableCell="content" let-message>
        {{ excerpt(message.content) }}
      </ng-template>

      <ng-template appTableCell="scheduledAt" let-message>
        <span>{{ message.scheduledAt }}</span>
        <small class="muted block">{{ frequencyLabel(message.frequency) }}</small>
      </ng-template>

      <ng-template appTableCell="status" let-message>
        <span class="table-pill" [class]="scheduledStatusClass(message.status)">
          {{ scheduledStatusLabel(message.status) }}
        </span>
      </ng-template>

      <ng-template appTableCell="actions" let-message>
        <div class="table-actions">
          <button class="btn btn--outline btn--sm" type="button" (click)="editScheduled(message)">Editar</button>
          <button class="btn btn--danger-outline btn--sm" type="button" (click)="cancelScheduled(message.id)">Cancelar</button>
        </div>
      </ng-template>
    </app-table>
  </article>
</section>

<app-modal title="Programar Mensaje" size="lg" [visible]="showScheduleModal()" (close)="closeScheduleModal()">
  <form class="message-form" [formGroup]="scheduleForm" (ngSubmit)="scheduleMessage()">
    <label class="field">
      <span>Destinatario</span>
      <select [formControl]="scheduleForm.controls.recipient">
        <option value="">Seleccionar destinatario</option>
        <option value="all">Todos los contactos</option>
        <option value="group:Pacientes activos">Grupo: Pacientes activos</option>
        <option value="group:Pagos pendientes">Grupo: Pagos pendientes</option>
        @for (patient of store.patients(); track patient.id) {
          <option [value]="patient.id">{{ store.patientName(patient) }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Cuerpo del mensaje</span>
      <textarea rows="7" [formControl]="scheduleForm.controls.content" placeholder="Escribí el mensaje programado..."></textarea>
    </label>

    <div class="schedule-grid">
      <label class="field">
        <span>Fecha y hora exacta</span>
        <input type="datetime-local" [formControl]="scheduleForm.controls.scheduledAt" />
      </label>

      <label class="field">
        <span>Frecuencia</span>
        <select [formControl]="scheduleForm.controls.frequency">
          <option value="once">Envío único</option>
          <option value="daily">Diario</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensual</option>
        </select>
      </label>
    </div>

    <div class="composer-tools">
      <span class="character-count">{{ scheduleCharacterCount() }} caracteres</span>
      <div class="attachment-actions">
        <button type="button" class="tool-btn" (click)="insertVariable(scheduleForm.controls.content, 'nombre')">Variable nombre</button>
        <button type="button" class="tool-btn" (click)="insertVariable(scheduleForm.controls.content, 'fecha')">Variable fecha</button>
      </div>
    </div>

    <div class="modal-actions-row">
      <button class="button button--ghost" type="button" (click)="closeScheduleModal()">Cancelar</button>
      <button class="button button--primary" type="submit">Programar Mensaje</button>
    </div>
  </form>
</app-modal>
